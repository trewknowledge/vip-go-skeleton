name: Tests

on:
  push:
    branches: [production]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpcs

  # Every theme under themes/ that ships a package.json (i.e. was generated by
  # @trewknowledge/create-theme) gets the full test matrix. Bundled themes
  # without one are skipped.
  discover:
    runs-on: ubuntu-latest
    outputs:
      themes: ${{ steps.find.outputs.themes }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          themes=$(find themes -mindepth 2 -maxdepth 2 -name package.json -printf '%h\n' | sort | jq -R . | jq -sc .)
          echo "themes=$themes" >> "$GITHUB_OUTPUT"

  js-unit:
    needs: discover
    if: needs.discover.outputs.themes != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.discover.outputs.themes) }}
    defaults:
      run:
        working-directory: ${{ matrix.theme }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ${{ matrix.theme }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:js

  php-unit:
    needs: discover
    if: needs.discover.outputs.themes != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.discover.outputs.themes) }}
    defaults:
      run:
        working-directory: ${{ matrix.theme }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ${{ matrix.theme }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: composer install --no-interaction --prefer-dist
      - name: Install root tooling (wp-env)
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Start wp-env
        working-directory: .
        run: pnpm env:start
      - run: pnpm test:php
      - if: always()
        working-directory: .
        run: pnpm env:stop

  e2e:
    needs: discover
    if: needs.discover.outputs.themes != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.discover.outputs.themes) }}
    defaults:
      run:
        working-directory: ${{ matrix.theme }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ${{ matrix.theme }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install root tooling (wp-env)
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Start wp-env
        working-directory: .
        run: pnpm env:start
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e-${{ strategy.job-index }}
          path: ${{ matrix.theme }}/playwright-report/
      - if: always()
        working-directory: .
        run: pnpm env:stop

  a11y:
    needs: discover
    if: needs.discover.outputs.themes != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.discover.outputs.themes) }}
    defaults:
      run:
        working-directory: ${{ matrix.theme }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ${{ matrix.theme }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install root tooling (wp-env)
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Start wp-env
        working-directory: .
        run: pnpm env:start
      - run: pnpm test:a11y
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y-${{ strategy.job-index }}
          path: ${{ matrix.theme }}/playwright-report/
      - if: always()
        working-directory: .
        run: pnpm env:stop
