name: Tests

# Pushes to production/staging/develop are tested by deploy.yml, which calls
# this workflow, so there is no push trigger here (it would run everything twice).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Only superseded PR runs are cancelled; a run called from deploy.yml must finish.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpcs

  # Every theme under themes/ that ships a package.json (i.e. was generated by
  # @trewknowledge/create-theme) gets the full test matrix. Bundled themes
  # without one are skipped.
  discover:
    runs-on: ubuntu-latest
    outputs:
      themes: ${{ steps.find.outputs.themes }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          themes=$(find themes -mindepth 2 -maxdepth 2 -name package.json -printf '%h\n' | sort | jq -R . | jq -sc .)
          echo "themes=$themes" >> "$GITHUB_OUTPUT"

  # One job per theme x suite. The suites share the same setup and differ only
  # in the script they run and which extra steps they need:
  #   composer   - install the theme's Composer dev dependencies (PHPUnit)
  #   playwright - install the Chromium browser
  #   wpenv      - start wp-env (Docker) from the repo root
  theme-tests:
    name: ${{ matrix.suite.name }} (${{ matrix.theme }})
    needs: discover
    if: needs.discover.outputs.themes != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.discover.outputs.themes) }}
        suite:
          - { name: js-unit, script: 'test:js' }
          - { name: php-unit, script: 'test:php', composer: true, wpenv: true }
          - { name: e2e, script: 'test:e2e', playwright: true, wpenv: true }
          - { name: a11y, script: 'test:a11y', playwright: true, wpenv: true }
    defaults:
      run:
        working-directory: ${{ matrix.theme }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ${{ matrix.theme }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - if: matrix.suite.composer
        run: composer install --no-interaction --prefer-dist

      - if: matrix.suite.playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Start wp-env
        if: matrix.suite.wpenv
        working-directory: .
        run: pnpm install --frozen-lockfile && pnpm env:start

      - run: pnpm ${{ matrix.suite.script }}

      - if: failure() && matrix.suite.playwright
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite.name }}-${{ strategy.job-index }}
          path: ${{ matrix.theme }}/playwright-report/

      - name: Stop wp-env
        if: always() && matrix.suite.wpenv
        working-directory: .
        run: pnpm env:stop
